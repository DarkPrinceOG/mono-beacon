name: Build MONO // BEACON Debug APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    android:
      api-level: 34
      build-tools: "34.0.0"
      api-level-26: "26"
      supported-archs: [x86_64, arm64-v8a]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '34'
          ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

      - name: Grant permissions for SDK
        run: |
          chmod +x $ANDROID_HOME/cmdline-tools/bin/sdkmanager
          chmod +x $ANDROID_HOME/platform-tools/adb

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          ANDROID_SDK_ROOT=$ANDROID_HOME ANDROID_CMDLINE_TOOLS=$ANDROID_HOME/cmdline-tools/latest

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradro-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradro-${{ runner.os }}-

      - name: Build Debug APK
        env:
          ORG_GRADLE_PROJECT_password: ''
          ORG_GRADLE_PROJECT_myAppBundleId: 'com.monobeacon.monobeacon'
        run: |
          cd mono-beacon
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mono-beacon-debug-apk
          path: mono-beacon/app/build/outputs/apk/debug/app-debug.apk
